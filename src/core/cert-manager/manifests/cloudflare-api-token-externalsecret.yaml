# Pulls the Cloudflare API token from Infisical (platform-h-vxm / prod /
# /cluster, key `cert-manager-cloudflare-api-token`) into a Secret in the
# cert-manager namespace. The ClusterIssuers reference this Secret for the
# DNS-01 solver. It must live in cert-manager's namespace because ClusterIssuer
# secret refs are resolved from --cluster-resource-namespace (default:
# cert-manager).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager-cloudflare-api-token
