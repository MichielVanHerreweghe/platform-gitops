apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird
  namespace: argocd
  labels:
    app: netbird
    project: core
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: netbird
  project: core
  sources:
    - chart: netbird-operator
      repoURL: "oci://ghcr.io/netbirdio/helm-charts/netbird-operator"
      targetRevision: 0.7.0
    - repoURL: "https://github.com/MichielVanHerreweghe/platform-gitops.git"
      path: src/core/netbird/manifests
      targetRevision: HEAD
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - CreateNamespace=true
      - PruneLast=true