# NetBird group that is allowed to reach the exposed cluster resources.
# Assign your PC's peer to this group in the NetBird dashboard.
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: k8s-admins
  namespace: netbird
spec:
  name: k8s-admins
---
# Routing peer(s) deployed in-cluster that join the NetBird mesh and route
# traffic to the exposed resources. HA via workloadOverride.replicas.
# NOTE: the DNS zone referenced here must be pre-created in the NetBird dashboard.
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: cluster
  namespace: netbird
spec:
  dnsZoneRef:
    name: k8s.internal
  workloadOverride:
    # Two routing peers so a self-heal restart of one (see livenessProbe below)
    # never drops connectivity -- the other keeps advertising the route.
    replicas: 2
    # The operator gives the routing peer only a startup + readiness probe, so a
    # peer that gets deregistered server-side (ephemeral peers are removed after
    # ~10 min offline) sits at 0/1 forever: the entrypoint runs `netbird up`
    # (which consumes NB_SETUP_KEY) only once at container start, while the
    # background daemon's reconnect loop has no setup key. A liveness probe forces
    # a container restart when the peer is no longer connected, which re-runs the
    # entrypoint and re-enrolls automatically -- no manual pod restart needed.
    podTemplate:
      spec:
        containers:
          - name: netbird
            livenessProbe:
              exec:
                command: ["netbird", "status", "--check", "ready"]
              periodSeconds: 30
              failureThreshold: 6 # ~3 min not-ready before restart (tolerates transient relay blips)
              timeoutSeconds: 5
---
# Exposes the kube-vip HA API VIP (a real host IP, not a ClusterIP) through the
# routing peer. We target the VIP instead of the kubernetes Service ClusterIP
# because Cilium runs as kube-proxy replacement with socket-LB, which only DNATs
# ClusterIPs for locally-originated sockets -- traffic *forwarded* through the
# routing peer is never translated, so a ClusterIP resource is unreachable.
# NBResource also creates the access policy inline (policySourceGroups).
# networkID is the NetBird-generated network created by the NetworkRouter above.
apiVersion: netbird.io/v1
kind: NBResource
metadata:
  name: kubernetes-api
  namespace: netbird
spec:
  name: kubernetes-api
  networkID: d8cn89ifadhs73bs47sg
  address: 10.0.0.33/32
  tcpPorts:
    - 6443
  groups:
    - k8s-admins
  policyName: k8s-api-access
  policySourceGroups:
    - k8s-admins
