# Pulls the Cloudflare API token from Infisical (platform-h-vxm / prod /
# /cluster, key `external-dns-cloudflare-api-token`) into a Secret in the
# external-dns namespace. external-dns reads it via the CF_API_TOKEN env var
# (see values.yaml). The token needs Zone:DNS:Edit + Zone:Zone:Read on every
# zone listed in domainFilters.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-secret-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: external-dns-cloudflare-api-token
