# Advertise LoadBalancer IPs on the local L2 segment (ARP). Requires Cilium to
# be installed with l2announcements.enabled=true and an adequately sized
# clientRateLimit (a Helm value on the Cilium release itself).
# https://docs.cilium.io/en/stable/network/l2-announcements/
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-policy
spec:
  # Announce only LoadBalancer Service IPs (not pod/ClusterIP externalIPs).
  loadBalancerIPs: true
  # Restrict to the NICs facing the L2 segment; omit to consider all interfaces.
  # interfaces:
  #   - ^eth[0-9]+
  nodeSelector:
    matchExpressions:
      # Don't announce from control-plane nodes.
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
