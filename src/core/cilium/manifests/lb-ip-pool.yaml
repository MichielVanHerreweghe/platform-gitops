# Pool of external IPs Cilium hands out to LoadBalancer Services (e.g. the
# Envoy Gateway proxy Service). With no serviceSelector the pool serves all
# LoadBalancer Services in the cluster.
# https://docs.cilium.io/en/stable/network/lb-ipam/
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
spec:
  blocks:
    - cidr: "10.0.1.0/27"
