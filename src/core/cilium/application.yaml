apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  labels:
    app: cilium
    project: core
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  project: core
  source:
    repoURL: "https://github.com/MichielVanHerreweghe/platform-gitops.git"
    path: src/core/cilium/manifests
    targetRevision: HEAD
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - PruneLast=true
