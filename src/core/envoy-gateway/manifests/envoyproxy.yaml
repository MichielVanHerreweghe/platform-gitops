# Data-plane (Envoy proxy) infrastructure config, referenced by the GatewayClass
# via parametersRef. Create this before the GatewayClass to avoid disruption.
# https://gateway.envoyproxy.io/docs/tasks/operations/customize-envoyproxy/
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # Run one Envoy pod on every node (DaemonSet) so each VPS's public IP has a
      # local data-plane instance. Combined with externalTrafficPolicy: Local
      # below, traffic hitting a VPS public IP is served by that same VPS's Envoy
      # with no extra hop and the client source IP preserved.
      envoyDaemonSet:
        container:
          resources:
            requests:
              cpu: 150m
              memory: 640Mi
            limits:
              memory: 1Gi
      # type: LoadBalancer is required for the Gateway's spec.addresses (the VPS
      # public IPs) to be surfaced as the Service's externalIPs; Cilium then
      # DNATs <public IP>:443 to the local Envoy. externalTrafficPolicy: Local
      # keeps traffic node-local and preserves the client IP (also the default).
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
