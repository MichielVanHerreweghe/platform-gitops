# Shared cluster Gateway. HTTPRoutes from any namespace can attach to it.
#
# TLS is issued automatically by cert-manager via the gateway-shim: the
# `cert-manager.io/cluster-issuer` annotation makes cert-manager create a
# Certificate for the listeners' hostnames and write it to the `eg-tls` Secret.
# All HTTPS listeners share that one Secret, so the resulting cert carries every
# hostname below as a SAN (codeforging.nl, www.codeforging.nl).
#
# No wildcards by design: add a dedicated HTTPS listener (its own hostname,
# pointing at eg-tls) for each subdomain that needs to be served.
#
# Switch the annotation to letsencrypt-staging while validating DNS-01, then
# back to letsencrypt-prod for browser-trusted certs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: "144.91.118.205"
spec:
  addresses:
    - type: IPAddress
      value: 144.91.118.205
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-nomaddigital
      protocol: HTTPS
      port: 443
      hostname: "nomaddigital.dev"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-tls
    - name: https-finplan-dev
      protocol: HTTPS
      port: 443
      hostname: "finplan.dev.nomaddigital.dev"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-tls