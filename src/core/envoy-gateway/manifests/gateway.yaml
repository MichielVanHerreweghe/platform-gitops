# Shared cluster Gateway. HTTPRoutes from any namespace can attach to it.
#
# TLS is issued automatically by cert-manager via the gateway-shim: the
# `cert-manager.io/cluster-issuer` annotation makes cert-manager create a
# Certificate for the listeners' hostnames and write it to the `eg-tls` Secret.
# All HTTPS listeners share that one Secret, so the resulting cert carries every
# hostname below as a SAN (codeforging.nl, www.codeforging.nl).
#
# No wildcards by design: add a dedicated HTTPS listener (its own hostname,
# pointing at eg-tls) for each subdomain that needs to be served.
#
# Switch the annotation to letsencrypt-staging while validating DNS-01, then
# back to letsencrypt-prod for browser-trusted certs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Tell external-dns to publish the VPS public IP(s) for every hostname served
    # here, instead of the private Cilium LB IP it would otherwise read from the
    # Gateway address. Keep this in sync with spec.addresses below. Once you have
    # confirmed the IP also shows up in `kubectl get gateway eg -n
    # envoy-gateway-system -o jsonpath='{.status.addresses}'`, this annotation
    # can be dropped (the gateway source reads status.addresses automatically).
    external-dns.alpha.kubernetes.io/target: "144.91.118.205"
spec:
  # The VPS public IP(s). Envoy Gateway surfaces these as the Envoy Service's
  # externalIPs (requires the Service to be LoadBalancer/NodePort, see
  # envoyproxy.yaml), so Cilium DNATs <public IP>:443 to the local Envoy pod.
  addresses:
    - type: IPAddress
      value: 144.91.118.205
  gatewayClassName: envoy-gateway
  listeners:
    # Plain HTTP on :80. Carries no routes of its own beyond the shared
    # http-to-https-redirect HTTPRoute, which 301s every request to HTTPS.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-codeforging
      protocol: HTTPS
      port: 443
      hostname: "codeforging.nl"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-tls
    - name: https-codeforging-www
      protocol: HTTPS
      port: 443
      hostname: "www.codeforging.nl"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-tls