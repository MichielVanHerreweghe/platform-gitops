# Shared cluster Gateway. HTTPRoutes from any namespace can attach to it.
# Add an HTTPS listener once cert-manager Gateway API support is enabled
# (set config.enableGatewayAPI=true on the cert-manager release).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
