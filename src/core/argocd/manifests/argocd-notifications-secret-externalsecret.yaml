# Pulls the GitHub token used by ArgoCD Notifications' `github` webhook service
# from Infisical into `argocd-notifications-secret` -- the secret name the
# notifications controller reads, where `$github-token` in argocd-notifications-cm
# resolves to the `github-token` key.
#
# The token needs permission to create a repository_dispatch on
# MichielVanHerreweghe/platform-gitops:
#   - Fine-grained PAT scoped to this repo with "Contents: Read and write"
#     (or a classic PAT with the `repo` scope).
#
# Required Infisical secret (prod / /cluster):
#   argocd-github-dispatch-token   the GitHub PAT described above
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Required so the notifications controller picks up the secret.
          app.kubernetes.io/part-of: argocd
      data:
        github-token: "{{ .githubToken }}"
  data:
    - secretKey: githubToken
      remoteRef:
        key: argocd-github-dispatch-token
