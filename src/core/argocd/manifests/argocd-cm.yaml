# Merged (Server-Side Apply) into the install-managed argocd-cm ConfigMap.
# Only the keys declared here are owned by ArgoCD; all other existing keys are
# left untouched.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # ArgoCD is not exposed externally; it is reached via:
  #   kubectl port-forward svc/argocd-server -n argocd 8080:443
  # The Entra app registration must allow https://localhost:8080/auth/callback
  # as a Web redirect URI.
  url: https://localhost:8080
  # clientID/clientSecret are resolved from the `argocd-azure` secret created by
  # the ExternalSecret in this directory. The issuer must be a literal: ArgoCD
  # only substitutes $secret refs for clientID/clientSecret, not the issuer.
  # TODO: replace TENANT_ID with your Entra (Azure AD) Directory (tenant) ID.
  # Authorization is driven by Entra "App roles": assign users/groups to roles
  # on the app's Enterprise Application, and ArgoCD reads the `roles` claim
  # (see argocd-rbac-cm.yaml). No requestedIDTokenClaims block is needed --
  # assigned app roles are emitted in the ID token automatically.
  oidc.config: |
    name: Azure
    issuer: https://login.microsoftonline.com/5897482a-f0cc-4b2a-acea-6df9a4fe00b5/v2.0
    clientID: $argocd-azure:clientID
    clientSecret: $argocd-azure:clientSecret
    requestedScopes:
      - openid
      - profile
      - email
