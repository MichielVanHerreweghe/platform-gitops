# Pulls the Microsoft Entra ID (Azure AD) OIDC credentials from Infisical
# (/cluster) into a secret that ArgoCD can resolve via the
# `$argocd-azure:<key>` syntax used in argocd-cm.
#
# NOTE: ArgoCD only substitutes `$<secret>:<key>` refs for the clientID and
# clientSecret fields of oidc.config -- NOT the issuer. The issuer (a public,
# non-sensitive URL containing the tenant ID) is therefore hardcoded in
# argocd-cm.yaml instead.
#
# Required Infisical secrets (platform-h-vxm / prod / /cluster):
#   argocd-azure-clientid      the Entra app registration's Application (client) ID
#   argocd-azure-clientsecret  a client secret created on that app registration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-azure
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-azure
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Required so ArgoCD will resolve `$argocd-azure:<key>` references.
          app.kubernetes.io/part-of: argocd
      data:
        clientID: "{{ .clientID }}"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientID
      remoteRef:
        key: argocd-azure-clientid
    - secretKey: clientSecret
      remoteRef:
        key: argocd-azure-clientsecret
