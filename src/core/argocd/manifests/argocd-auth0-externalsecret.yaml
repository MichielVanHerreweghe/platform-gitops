# Pulls the Auth0 OIDC credentials from Infisical (/cluster) into a secret that
# ArgoCD can resolve via the `$argocd-auth0:<key>` syntax used in argocd-cm.
#
# NOTE: ArgoCD only substitutes `$<secret>:<key>` refs for the clientID and
# clientSecret fields of oidc.config -- NOT the issuer. The issuer (a public,
# non-sensitive URL) is therefore hardcoded in argocd-cm.yaml instead.
#
# Required Infisical secrets (platform-h-vxm / prod / /cluster):
#   argocd-auth0-clientid      the Auth0 Application Client ID
#   argocd-auth0-clientsecret  the Auth0 Application Client Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-auth0
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-auth0
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Required so ArgoCD will resolve `$argocd-auth0:<key>` references.
          app.kubernetes.io/part-of: argocd
      data:
        clientID: "{{ .clientID }}"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientID
      remoteRef:
        key: argocd-auth0-clientid
    - secretKey: clientSecret
      remoteRef:
        key: argocd-auth0-clientsecret
