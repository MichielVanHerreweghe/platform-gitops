# Pulls the Auth0 OIDC credentials from Infisical (/cluster) into a secret that
# ArgoCD can resolve via the `$argocd-auth0:<key>` syntax used in argocd-cm.
#
# Required Infisical secrets (platform-h-vxm / prod / /cluster):
#   argocd-auth0-issuer         e.g. https://YOUR_TENANT.eu.auth0.com/  (trailing slash, matches Auth0 OIDC issuer)
#   argocd-auth0-client-id      the Auth0 Application Client ID
#   argocd-auth0-client-secret  the Auth0 Application Client Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-auth0
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-auth0
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # Required so ArgoCD will resolve `$argocd-auth0:<key>` references.
          app.kubernetes.io/part-of: argocd
      data:
        issuer: "{{ .issuer }}"
        clientID: "{{ .clientID }}"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: issuer
      remoteRef:
        key: argocd-auth0-issuer
    - secretKey: clientID
      remoteRef:
        key: argocd-auth0-clientid
    - secretKey: clientSecret
      remoteRef:
        key: argocd-auth0-clientsecret
