# Merged (Server-Side Apply) into the install-managed argocd-rbac-cm ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # Everyone who can authenticate gets read-only access unless a group grants more.
  policy.default: role:readonly
  # Tells ArgoCD which OIDC token claim(s) to use for RBAC subject/group matching.
  # Entra emits assigned App roles in the 'roles' claim (friendly names).
  scopes: '[roles]'
  policy.csv: |
    # Map Entra App roles (from the 'roles' claim) to ArgoCD roles. The value
    # is the app role's "Value" field defined on the Entra app registration.
    g, argocd-admins, role:admin
