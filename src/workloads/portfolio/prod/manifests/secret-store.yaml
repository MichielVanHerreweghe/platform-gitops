# App-scoped Infisical store for the portfolio backend, scoped to the
# /cluster/app-portfolio folder where this app's secrets live. ClusterSecretStore
# so it reuses the shared `infisical-auth` machine identity in `external-secrets`.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-app-portfolio
spec:
  provider:
    infisical:
      hostAPI: https://eu.infisical.com/api
      auth:
        universalAuthCredentials:
          clientId:
            key: clientId
            namespace: external-secrets
            name: infisical-auth
          clientSecret:
            key: clientSecret
            namespace: external-secrets
            name: infisical-auth
      secretsScope:
        projectSlug: platform-h-vxm
        environmentSlug: prod
        secretsPath: "/cluster/app-portfolio"
