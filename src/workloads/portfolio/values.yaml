frontend:
  replicaCount: 2

  image:
    repository: ghcr.io/michielvanherreweghe/portfolio-frontend
    tag: "2.1.2"

  # The frontend nginx proxies /api at request time via `resolver`, which does
  # NOT apply resolv.conf search domains — so the chart's auto-derived bare
  # `portfolio-backend` upstream NXDOMAINs. Pin the in-cluster FQDN instead.
  # (Namespace-specific: this release runs in the `portfolio` namespace.)
  apiProxy:
    upstream: portfolio-backend.portfolio.svc.cluster.local:80

  gateway:
    enabled: true
    parentRefs:
      - name: eg
        namespace: envoy-gateway-system
        sectionName: https-nomaddigital
    hostnames:
      - nomaddigital.dev
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  ciliumNetworkPolicy:
    enabled: true
    ingress:
      fromGateway:
        enabled: true
        endpointSelector:
          matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-name: eg
    egress:
      # DNS to kube-dns so nginx can resolve the backend at request time.
      allowDNS: true
      # Reverse-proxy /api/* to the in-cluster backend Pods. Renders the backend
      # selector from the chart helper (same labels the backend Pods get), so it
      # can't drift from the release name. Port is the backend container port.
      toBackend:
        enabled: true
        port: "8080"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

backend:
  enabled: true

  image:
    repository: ghcr.io/michielvanherreweghe/portfolio-backend
    tag: "1.0.0"

  gateway:
    enabled: false

  ciliumNetworkPolicy:
    ingress:
      fromGateway:
        enabled: false
      fromFrontend:
        enabled: true
    egress:
      toWorldPorts:
        - port: "443"
          protocol: TCP
        - port: "465"
          protocol: TCP
        # OCSP/CRL certificate-revocation checks over HTTP. MailKit validates the
        # SMTP server's TLS cert with CheckCertificateRevocation=true by default,
        # which fetches http://ocsp.sectigo.com (port 80). Without this the SYN is
        # dropped, the revocation check hangs, and the contact-form send times out.
        - port: "80"
          protocol: TCP

  config:
    MailService__Host: mail.spacemail.com
    MailService__Port: "465"
    MailService__Username: info@nomaddigital.dev
    MailService__FromName: portfolio
    MailService__FromEmailAddress: info@nomaddigital.dev
    MailService__ToName: Michiel Van Herreweghe
    MailService__ToEmailAddress: michiel@nomaddigital.dev
    MailService__UseSsl: "true"
    HardcoverService__BaseUrl: https://api.hardcover.app/v1/graphql
    Cache__InstanceName: "portfolio:"

  externalSecret:
    enabled: true
    secretStoreRef:
      name: infisical-app-portfolio
      kind: ClusterSecretStore
    data:
      - secretKey: MailService__Password
        remoteRef:
          key: app-portfolio-mail-password
      - secretKey: HardcoverService__ApiToken
        remoteRef:
          key: app-portfolio-hardcover-api-token

cache:
  enabled: true
  name: portfolio-cache
  replicas: 2
  args:
    - "--proactor_threads=2"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi