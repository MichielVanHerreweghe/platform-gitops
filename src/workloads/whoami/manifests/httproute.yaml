# Attaches to the shared eg Gateway's HTTPS listener and routes codeforging.nl
# to the whoami Service. The Gateway lives in envoy-gateway-system and allows
# routes from all namespaces, so this cross-namespace parentRef is permitted.
# external-dns (gateway-httproute source) reads this hostname and publishes the
# A record (-> the VPS public IP, per the Gateway's target annotation).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-codeforging
  hostnames:
    - codeforging.nl
  rules:
    - backendRefs:
        - name: whoami
          port: 80
